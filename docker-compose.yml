# Run rtail-server.
#
#   docker compose up -d
#
# Then point clients at this host's UDP port:
#
#   mycommand | rtail --host <this-host>
#
# That pulls the published image, the newest release.
#
# `build: .` does nothing on its own — Compose pulls `image:` and builds only
# if the pull fails. To run a checkout instead:
#
#   docker compose up -d --build
#
# That tags what it built with the same name, so a plain `up` keeps running
# it until `docker compose pull` puts the published image back.

services:
  rtail:
    image: ghcr.io/kilianc/rtail:latest
    build: .
    restart: unless-stopped
    ports:
      - '8888:8888'
      - '9999:9999/udp'
    environment:
      # Uncomment to log at debug level.
      # RTAIL_VERBOSE: 'true'
      # Uncomment, with the two volume blocks below, to keep logs across
      # restarts. Without it the server is memory-only.
      # RTAIL_DATA: /data
      RTAIL_WEB_PORT: '8888'
      RTAIL_UDP_PORT: '9999'
    # volumes:
    #   - rtail-data:/data

# volumes:
#   rtail-data:
