name: CI

# Every change reaches main through a pull request, so a PR run and a post-merge
# run on main are the only two that matter.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the `engines` floor; upper bound is current LTS.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check the webapp
        run: npm run typecheck

      - name: Build the webapp
        run: npm run build

      - name: Build the distributable webapp
        run: npm run dist

      - name: Test
        run: npm test
