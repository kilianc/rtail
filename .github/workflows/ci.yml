name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The server. v2 moved it from Node to Go; the webapp is embedded into the
  # binary, so the Go build needs the assets built first.
  #
  # P2 embeds DuckDB, which is cgo — so this is a per-platform build now, not
  # one static binary. The matrix is what stops "works on my machine" from
  # becoming the release process.
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l cmd internal web)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      # The interop tests assert that our Parquet files are readable by a
      # completely unrelated implementation. That claim is the product's core
      # promise, so it is checked rather than asserted — the tests skip
      # themselves when duckdb is absent, which is exactly why CI installs it.
      - name: Install duckdb (linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.4.1/duckdb_cli-linux-amd64.zip
          sudo unzip -q /tmp/duckdb.zip -d /usr/local/bin
          duckdb -c "SELECT 'duckdb ' || version()"

      - name: Install duckdb (macos)
        if: runner.os == 'macOS'
        run: |
          brew install duckdb
          duckdb -c "SELECT 'duckdb ' || version()"

      - name: Test
        run: go test -race ./...

      # CGO_ENABLED=1 is required from P2 on: go-duckdb has no pure-Go
      # fallback, and a CGO_ENABLED=0 build fails at link time rather than
      # silently losing search.
      - name: Build
        run: CGO_ENABLED=1 go build -trimpath -o /tmp/rtail-server ./cmd/rtail-server

  # The webapp. Node builds it and is not in the product: the server embeds
  # the bundle and the client is a Go binary, so the only thing a Node version
  # can break here is the build itself.
  webapp:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the launcher's `engines` floor — the one piece of
        # JavaScript that still runs on a user's machine. Upper bound is
        # current LTS.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check the webapp
        run: npm run typecheck

      - name: Build the webapp
        run: npm run build

      - name: Build the embedded webapp
        run: npm run dist

  # The npm packages, laid out and exercised but never published here.
  #
  # This is the step that would have caught a launcher that cannot find its
  # binary, which is the one failure the install layout can have and the one
  # that only shows up after `npm publish`.
  npm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lay out the packages
        run: sh tools/npm-pack.sh 0.0.0-ci

      - name: Install as a user would, and run it
        run: |
          mkdir -p /tmp/launch && cd /tmp/launch
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/dist/npm/rtail-linux-x64" --no-audit --no-fund
          npm install "$GITHUB_WORKSPACE/dist/npm/rtail" --no-optional --no-audit --no-fund
          [ "$(./node_modules/.bin/rtail --version)" = "0.0.0-ci" ]
          printf 'hello\n' | ./node_modules/.bin/rtail --port 9999 | grep -qx hello
          ./node_modules/.bin/rtail --nope 2>&1 | grep -q 'unknown argument'

  # The whole thing, exactly as it ships.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rtail:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name rtail -p 8888:8888 -p 9999:9999/udp rtail:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8888/healthz && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8888/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:8888/ | grep -qi '<title'
          docker rm -f rtail
