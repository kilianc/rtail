name: Docker

# Never fires on its own: the Release workflow calls it once a version bump has
# been tagged, or you run it by hand to re-push an image.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to tag the image with, e.g. 0.2.1'
        required: true
        type: string
      latest:
        description: 'Also push the `latest` tag'
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the image with, e.g. 0.2.1'
        required: true
        type: string
      latest:
        description: 'Also push the `latest` tag'
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
