# Cut a release.
#
# Tag `v2.0.0` and this tests the commit, builds the binaries and the container
# image, publishes the npm packages, and creates the GitHub release that carries
# the tarballs.
#
# ** Nothing is published until everything before it is green. **
#
# A tag is the only thing that says a commit is releasable, and nothing stops
# one landing on a commit CI never saw — so the release runs the tests itself,
# before it builds anything. After that the order is how hard each step is to
# take back: the image (an image tag can be pushed again), then npm (a
# version, once published, can never be published again, not even after an
# unpublish), then the GitHub release (an edit). A failed smoke test on any of
# the four targets stops all three.
#
# ** Why there is a build matrix instead of one static binary. **
#
# P2 embedded DuckDB, which is cgo. There is no pure-Go fallback, so a
# CGO_ENABLED=0 build fails at link time rather than quietly losing search —
# and cgo means no practical cross-compilation. Every target is therefore built
# on a runner of its own architecture, which is slower to configure once and
# the only arrangement that is actually honest about what it produced.
#
# Linux binaries are built inside the same Debian bookworm container the image
# uses, not on the runner. A binary linked against the runner's newer glibc
# refuses to start on an older distribution, and "works on the machine that
# built it" is exactly what a release pipeline exists to prevent.
#
# This replaces docker.yml, which published the image on the same tags. Two
# workflows racing to push the same tag is a bug waiting for a slow day; the
# image is a step of the release now, and it is gated on the binaries having
# built and answered /healthz first — and on the image itself answering it,
# on amd64 and on arm64, before a single layer is pushed.

name: release

on:
  push:
    tags: ['v*']
  # So the whole thing can be rehearsed on a branch without cutting a tag.
  workflow_dispatch:

# ** Read-only unless a job says otherwise. **
#
# `npm ci` runs code from every package in the lockfile, and none of it needs a
# token that can push an image or rewrite a release. So the default is read,
# the two jobs that write are granted exactly what they write, checkout does
# not leave the token behind in .git/config, and `npm ci` runs with
# --ignore-scripts — esbuild finds its platform binary without its postinstall.
#
# Actions are pinned to a commit for the same reason. A tag is a pointer that
# anyone with push rights on that repository can move; the SHA is the code
# that was looked at. The comment beside it says which release it is.
permissions:
  contents: read

jobs:
  # The Linux half of CI's `server` job, run again on the tagged commit.
  #
  # CI runs on pull requests and on main, and a tag is neither: a tag on a
  # commit that never went through a PR, or on one whose CI went red, would
  # otherwise build, smoke-test and publish without a single test having run
  # against it. Linux only — the macOS half costs ten times as much a minute,
  # and both macOS binaries are started and asked for /healthz below before
  # anything is published.
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.mod

      # Exactly as ci.yml installs it: the interop tests skip themselves
      # without duckdb, and tools/ci.sh refuses to run rather than let them.
      - name: Install duckdb
        run: |
          curl -fsSL -o /tmp/duckdb.zip \
            https://github.com/duckdb/duckdb/releases/download/v1.4.1/duckdb_cli-linux-amd64.zip
          sudo unzip -q /tmp/duckdb.zip -d /usr/local/bin

      - run: sh tools/ci.sh server

  # The webapp is built once and shared: it is identical on every platform,
  # and building it per-target would be four chances to ship four different
  # bundles under one version number.
  webapp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The webapp reads its version from package.json; everything else reads
      # it from the tag. This is the only thing that holds the two together,
      # and without it a tag that disagrees ships a UI announcing a version
      # other than the one it was downloaded as. Read with sed, the way the
      # Makefile does.
      - name: The tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME is $tag, package.json says $pkg"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - run: npm run dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webapp
          path: web/dist
          retention-days: 1

  binaries:
    needs: [webapp, test]

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          # macos-15-intel, not macos-13: GitHub retired the macOS 13 image on
          # 4 December 2025, and a job asking for it is not refused — it is
          # queued, for ever. The v2.0.0-rc.1 release sat at six hours of
          # "queued" on this line with the other three targets built in under
          # a minute, and everything after this job waits on all four.
          #
          # This is the last Intel macOS runner GitHub offers; x86_64 macOS
          # goes away when the macOS 15 image retires in autumn 2027.
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.mod

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webapp
          path: web/dist

      # Off a tag, the version is made up from the commit. The `g` is there
      # for the reason `git describe` writes one: a short SHA can come out all
      # digits, and a numeric prerelease identifier with a leading zero —
      # 0.0.0-0123456 — is not semver, so npm refuses the whole rehearsal.
      - name: Version from the tag
        id: version
        shell: bash
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            ref="0.0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      # macOS builds natively; Linux builds in bookworm so the binary runs on
      # anything with glibc 2.36 or newer rather than only on the runner.
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CGO_ENABLED=1 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o rtail-server ./cmd/rtail-server

      - name: Build (Linux, in bookworm)
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CGO_ENABLED=1 -e VERSION \
            -v "$PWD:/src" -w /src \
            golang:1.26.3-bookworm \
            go build \
              -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o rtail-server ./cmd/rtail-server

      # The binary is the whole product, so it is run before it is published.
      # A release that cannot answer /healthz is worth catching here rather
      # than in somebody's issue.
      # The client is pure Go with no cgo, so it builds for this target
      # wherever we happen to be standing. It goes in the same tarball as the
      # server: one download, both halves, same version.
      - name: Build the client
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o rtail ./cmd/rtail
          ./rtail --version

      - name: Smoke-test what was built
        shell: bash
        run: |
          ./rtail-server --version
          ./rtail-server --web-port 8899 --udp-port 9899 &
          pid=$!
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8899/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          # The webapp has to be embedded, not merely built: this is the check
          # that catches a missing web/dist artifact.
          curl -sf http://127.0.0.1:8899/ | grep -qi '<title'
          kill "$pid"

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="rtail_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist/$name"
          # NOTICE travels with LICENSE: Apache-2.0 §4(d) has anyone who
          # redistributes this pass it on, which they can only do if the
          # tarball carries it.
          cp rtail-server rtail README.md LICENSE NOTICE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          # Checksums are produced next to the artifact and merged later, so a
          # failed target cannot silently drop a line from the manifest.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 1

  # ** The image, one architecture per runner. **
  #
  # Each architecture is built on a runner of its own kind — the same
  # ubuntu-24.04-arm the arm64 binary is built on — then started and asked for
  # /healthz, natively, before anything is pushed. ci.yml smoke-tests amd64 on
  # pull requests and on main, which a tag is neither, and arm64 was never
  # started anywhere until somebody pulled it.
  #
  # arm64 used to be built on the amd64 runner under QEMU. The Dockerfile
  # compiles the server — Go and DuckDB's cgo — and compiling under emulation
  # took ten minutes on a cold cache, against a minute or two natively, and
  # the smoke test ran emulated too. The cost of building on two runners is that neither
  # can push a multi-arch tag: each pushes its image by digest alone, and
  # image-manifest below puts the tags on the pair.
  image:
    needs: binaries

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    # The image jobs are the only ones that write to the registry, and so the
    # only ones that can.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Version from the tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            ref="0.0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # For the labels. The tags are image-manifest's.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}

      # Built, loaded into the daemon and put through the same
      # `tools/ci.sh image` CI uses. The push after it is a cache hit — the
      # builder keeps the layers it has just made — so the image pushed is the
      # one tested, as long as the build-args match, and they have to: the
      # version is baked into a layer.
      #
      # One cache scope per architecture. Both jobs write their cache at once,
      # and in one scope each would overwrite the other's.
      - name: Build, to test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: rtail:ci
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}

      - name: Smoke-test
        run: RTAIL_CI_IMAGE_PREBUILT=1 sh tools/ci.sh image

      # By digest, with no tag: a tag here would name one architecture, and
      # the other job's push would move it to the other.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without the `v`, as the tarballs and npm have it, so /healthz and
          # --version agree whichever way rtail was installed.
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max

      - name: Hand the digest on
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ** The tags, on both architectures at once. **
  #
  # One manifest list naming the two digests the image jobs pushed, under every
  # tag the release gets. Nothing is tagged until both architectures have been
  # built, started and pushed, so a tag never points at half a release.
  #
  # The steps are conditional and the job is not. npm needs this job, and a
  # job that needs a skipped one is skipped too: on a rehearsal, with nothing
  # pushed to name, this does nothing and lets npm's smoke test run.
  image-manifest:
    needs: image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: startsWith(github.ref, 'refs/tags/')

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is the newest *release*, not the newest tag, so an rc gets its
      # own version tag and leaves `latest` where it was. `next` is the newest
      # prerelease — npm's `next`, under the same name and for the same reason
      # — and it is what the README and docker-compose.yml point at while 2.0
      # is a release candidate. Without it nothing moved during a release
      # candidate: `latest` stayed on the rc cut before this rule, and every
      # fix since was reachable only by its exact version.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        if: startsWith(github.ref, 'refs/tags/')
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
            type=raw,value=next,enable=${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') }}

      - name: Tag both architectures
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          digests=(*)
          [ "${#digests[@]}" -eq 2 ] || { echo "expected two digests, found: ${digests[*]}"; exit 1; }

          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in "${digests[@]}"; do args+=("$IMAGE@sha256:$digest"); done

          docker buildx imagetools create "${args[@]}"

          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # ** npm **
  #
  # One package per platform, each declaring its `os` and `cpu`, plus the
  # package people actually install — a launcher and a list of optional
  # dependencies. npm downloads the one binary that matches the machine doing
  # the installing and skips the rest.
  #
  # The platform packages go first and the launcher last: a published `rtail`
  # whose optional dependencies do not exist yet is an install that fails for
  # everyone who is quick.
  #
  # And the whole job waits for the binaries and the image. npm is the one
  # step here that cannot be taken back — a version number, once published, is
  # spent for good — so it happens only after everything that could still fail
  # has had its chance to.
  npm:
    needs: [binaries, image-manifest]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Version from the tag
        id: version
        run: |
          ref="${GITHUB_REF#refs/tags/}"
          if [ "$ref" = "$GITHUB_REF" ]; then
            ref="0.0.0-g$(git rev-parse --short HEAD)"
          fi
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Lay out the packages
        run: sh tools/npm-pack.sh "${{ steps.version.outputs.version }}"

      # The launcher is the one piece of JavaScript left in the install, so it
      # is checked on the runner before it is published: resolve the binary
      # for this platform, run it, read back the version it was stamped with.
      # Through tarballs, not the laid-out directories: `npm install <dir>`
      # symlinks, and Node resolves modules through the realpath, so the
      # launcher would look for its binary next to dist/npm/ rather than in
      # the node_modules it was installed into. Packing first makes this the
      # install a user gets.
      - name: Smoke-test the launcher
        run: |
          version="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/tgz /tmp/launch
          (cd dist/npm/rtail-linux-x64 && npm pack --pack-destination /tmp/tgz)
          (cd dist/npm/rtail && npm pack --pack-destination /tmp/tgz)

          cd /tmp/launch
          npm init -y >/dev/null
          npm install "/tmp/tgz/rtail-linux-x64-$version.tgz" --no-audit --no-fund
          npm install "/tmp/tgz/rtail-$version.tgz" --omit=optional --no-audit --no-fund

          got="$(./node_modules/.bin/rtail --version)"
          echo "launcher reports $got"
          [ "$got" = "$version" ]
          printf 'hello\n' | ./node_modules/.bin/rtail --port 9999 | grep -qx hello

      # Anything already on npm at this version is skipped, so a publish that
      # died halfway — a registry hiccup on the third package — is finished by
      # re-running the job. Without that the re-run fails on the first package,
      # because republishing a version is refused, and the launcher is never
      # published at all.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac

          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is already on npm; skipping"
              return
            fi
            npm publish "$1" --access public --tag "$tag"
          }

          for dir in dist/npm/rtail-*; do
            publish "$dir"
          done

          publish dist/npm/rtail

  release:
    needs: [binaries, image-manifest, npm]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Creating the release and uploading its assets is the only write here.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: One checksum manifest
        run: cat dist/*.sha256 > dist/checksums.txt && rm dist/*.sha256

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          # Every release before 2.0.0 is a prerelease, so a `v2.0.0-rc.1` tag
          # does not become the download the README points at.
          prerelease: ${{ contains(github.ref_name, '-') }}
