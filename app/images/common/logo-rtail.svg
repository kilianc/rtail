<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 28" width="116" height="28" role="img" aria-label="rtail">
  <!--
    The rtail lockup. Three log lines falling away to the right — the tail —
    and a detached square holding the next one: the cursor.

    Everything is an axis-aligned rect on a 4 unit grid, the wordmark included,
    so the asset obeys the app's own rules (zero radius, every length a token)
    and carries no font dependency. One colour, because both the app's top bar
    and the landing page nav mask this file with currentColor.

    Grid: stroke 4, x-height 20 (y8 to the baseline at y28), ascenders to y0,
    6 between letters, 12 between the mark and the wordmark.
  -->
  <g fill="currentColor">
    <!-- mark: lines, then the cursor detached on the last row -->
    <rect x="0" y="4" width="32" height="4"/>
    <rect x="0" y="14" width="20" height="4"/>
    <rect x="0" y="24" width="12" height="4"/>
    <rect x="16" y="24" width="4" height="4"/>

    <!-- r -->
    <rect x="44" y="8" width="4" height="20"/>
    <rect x="48" y="8" width="8" height="4"/>

    <!-- t -->
    <rect x="62" y="8" width="12" height="4"/>
    <rect x="66" y="0" width="4" height="28"/>
    <rect x="70" y="24" width="4" height="4"/>

    <!-- a: square counter, aperture open to the left -->
    <rect x="80" y="8" width="12" height="4"/>
    <rect x="80" y="16" width="12" height="4"/>
    <rect x="80" y="16" width="4" height="12"/>
    <rect x="80" y="24" width="12" height="4"/>
    <rect x="88" y="8" width="4" height="20"/>

    <!-- i -->
    <rect x="98" y="0" width="4" height="4"/>
    <rect x="98" y="8" width="4" height="20"/>

    <!-- l -->
    <rect x="108" y="0" width="4" height="28"/>
    <rect x="112" y="24" width="4" height="4"/>
  </g>
</svg>
